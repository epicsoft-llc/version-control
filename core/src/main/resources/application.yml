################################################################################
#### Version Control — backend configuration
####
#### Values that only ever come from the environment carry the literal
#### USE_ENV. The real value arrives as an environment variable through Spring's
#### relaxed binding (VC_GITHUB_TOKEN -> vc.github.token). Never put a secret,
#### and never put a working default, into this file.
####
#### Every consumer must treat USE_ENV exactly like a missing value — see
#### VcUtil.isConfigured(). Without that check the application calls the
#### upstream API with the literal "USE_ENV" as its token on every request.
################################################################################
vc:
  i18n:
    langs: en,de
    default-lang: en
  github:
    #### Optional. Without a token the update check keeps working at the lower
    #### rate limit (60 requests/hour instead of 5.000).
    token: USE_ENV
  telegram:
    #### Optional. Without a token nothing goes to Telegram.
    bot-token: USE_ENV
    chat-id: USE_ENV
  mail:
    #### Optional, any SMTP server. Without host, sender and recipient no mail is sent.
    host: USE_ENV
    #### starttls (587), tls (465) or none (25); vc.mail.port only for a different port.
    security: starttls
    #### Without a username no login is attempted.
    username: USE_ENV
    password: USE_ENV
    #### The sender, optionally with a name: "Version Control <vc@example.com>".
    from: USE_ENV
    #### One or more recipients, comma separated.
    to: USE_ENV
  scheduler:
    #### Switched off in tests: a scheduled check would call upstream sources
    #### from a test run, which is both slow and somebody else's traffic.
    enabled: true
    tick-interval: 15m
  check:
    default-interval: 48h
    #### Hard lower bound, applies to manually triggered checks and to the rule
    #### preview as well — an exception here is the path by which it gets bypassed.
    min-interval: 48h
    jitter: 2h
    backoff: 1h,4h,12h
    error-grace-days: 3
  eol:
    check-interval: 7d
    warn-months: 6
    escalate-months: 3
  notification:
    daily-time: "08:00"
  display:
    #### short (29.9.2-1) or full (5:29.9.2-1~ubuntu.24.04~noble). Only how a Debian package version is written,
    #### never what is stored, compared or copied.
    debian-versions: ${VC_DISPLAY_DEBIAN_VERSIONS:short}
  vulnerabilities:
    #### Optional, see docs/vulnerabilities.md; without a URL nothing is looked up.
    db:
      url: USE_ENV
      username: USE_ENV
      password: USE_ENV
      #### The JAR of the JDBC driver, mounted from outside; not needed for PostgreSQL.
      driver: USE_ENV
    check-interval: 1d
    #### From this CVSS score on a finding is a task; one known to be exploited always is.
    task-min-score: 9.0

spring:
  application:
    name: vc-core
  datasource:
    url: jdbc:postgresql://${VC_DATABASE_HOST:localhost}:${VC_DATABASE_PORT:5432}/${VC_DATABASE_NAME:versioncontrol}
    username: ${VC_DATABASE_USERNAME:USE_ENV}
    password: ${VC_DATABASE_PASSWORD:USE_ENV}
    hikari:
      #### A few requests a minute and one scheduler; every idle connection is a PostgreSQL process of its own.
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      #### The schema belongs to Flyway, never to Hibernate.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

springdoc:
  #### The texts are English and written in the annotations; looked up in the
  #### MessageSource, each one would be logged as a missing key on every request.
  disable-i18n: true
  api-docs:
    #### Set on purpose: left unset, springdoc warns at every start that it is on.
    enabled: true
    #### Under /api, so the dashboard container forwards it like every other call.
    path: /api/v1/openapi.json
    version: openapi_3_1
  paths-to-match: /api/v1/**

server:
  port: 8080

management:
  #### Actuator on a port of its own, so the health endpoint is reachable for the
  #### container check without being exposed together with the API.
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    one.epicsoft.vc: INFO
