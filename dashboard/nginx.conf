# The dashboard container is the single entry point: it serves the static files
# and forwards /api to the backend. That keeps the Angular build environment
# independent — a relative API base, no rebuild per environment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output never changes under the same name.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # assets/ keeps its names from release to release - the translations, the icon. Asked
    # again on every load, answered with 304 while unchanged; cached like the hashed files
    # above, a key added in a release showed up as the key itself until the cache expired.
    location ^~ /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html must not be cached, or a deploy stays invisible.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://core:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single page application: every unknown path is a route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
