###############################################################################
#### Branch / Tag | Meaning
#### -------------|--------
#### develop      | work in progress
#### main         | released state
#### X.Y.Z (Tag)  | release
###############################################################################

stages:
  - build
  - test
  - license
  - dependency
  - security
  - artifact
  - release

variables:
  VERSION: ${CI_COMMIT_REF_NAME}
  GRADLE_OPTS: "-Dorg.gradle.console=plain -Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"
  #### Official images only — this repository is public and must build for
  #### anyone, without an account anywhere.
  JDK_IMAGE: eclipse-temurin:25-jdk
  JRE_IMAGE_VERSION: 25-jre-alpine
  NODE_IMAGE: node:24-alpine
  ALPINE_IMAGE: alpine:3.24
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  #### Where a release goes besides the GitLab registry. The jobs that publish
  #### there run only where the credentials exist, so a fork builds without them.
  VC_DOCKER_HUB_REPOSITORY: epicsoft/version-control
  VC_GITHUB_REPOSITORY: epicsoft-llc/version-control

#### No pipeline for merge requests — the branch pipeline is the verification.
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: always

.gradle-cache: &gradle-cache
  #### Keyed on the dependency files, not the branch: branches and tags share it, a new one only when versions change.
  key:
    files: [ "libs.versions.toml", "gradle/wrapper/gradle-wrapper.properties" ]
    prefix: vc-gradle
  paths: [ "${GRADLE_USER_HOME}/caches", "${GRADLE_USER_HOME}/wrapper" ]
  policy: pull-push

.node-cache: &node-cache
  #### npm's download cache, not node_modules: npm ci deletes node_modules before installing.
  key:
    files: [ "dashboard/package-lock.json" ]
    prefix: vc-node
  paths: [ "dashboard/.npm" ]
  policy: pull-push

###############################################################################
#### core (backend)
###############################################################################
BLD:core:
  stage: build
  image: ${JDK_IMAGE}
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew :core:clean :core:assemble -x test
  cache: *gradle-cache
  artifacts:
    name: "vc-core-${CI_COMMIT_REF_NAME}-${CI_PIPELINE_ID}"
    paths: [ "core/build" ]
    expire_in: 1h
  retry: 1

TST:core:
  stage: test
  image: ${JDK_IMAGE}
  services:
    #### PostgreSQL as a service, not Testcontainers inside dind: the job then
    #### needs no Docker at all, and one database less is pulled and started.
    #### Locally the same tests start their own container — see
    #### AbstractIntegrationTest.
    - name: postgres:18-alpine
      alias: postgres
  variables:
    #### No password anywhere: the service listens only inside this job's network
    #### and lives for the length of it, so "trust" is both safe and honest —
    #### a made-up password in a public file would only look like a secret.
    POSTGRES_DB: versioncontrol
    POSTGRES_USER: vc
    POSTGRES_HOST_AUTH_METHOD: trust
    #### Read by application.yml; VC_DATABASE_HOST is also what tells the tests
    #### to use this database instead of starting one.
    VC_DATABASE_HOST: postgres
    VC_DATABASE_NAME: versioncontrol
    VC_DATABASE_USERNAME: vc
    VC_DATABASE_PASSWORD: ""
  before_script:
    - chmod +x gradlew
  script:
    #### check, not test: the offline verifications hang off `check`, and a job
    #### that only runs the tests leaves them switched off in the one place
    #### where nobody would notice.
    - ./gradlew :core:check
  coverage: '/Total.*?([0-9]{1,3})%/'
  cache: *gradle-cache
  artifacts:
    name: "vc-core-test-${CI_COMMIT_REF_NAME}-${CI_PIPELINE_ID}"
    paths: [ "core/build/reports" ]
    reports:
      junit: core/build/test-results/test/TEST-*.xml
    expire_in: 1h
  needs: [ "BLD:core" ]
  #### Tests and checks run on develop; main and the tags only build and publish what develop verified.
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  retry: 1

#### The task fails on available updates; allow_failure turns that into a
#### warning rather than a stop — red for an update teaches people to ignore red.
DEP:core:
  stage: dependency
  image: ${JDK_IMAGE}
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew checkDependencyUpdates
  cache:
    <<: *gradle-cache
    policy: pull
  needs: [ "BLD:core" ]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true

#### Runs on develop and only when the VC_DEPCHECK_* variables exist, so nothing about that
#### database is described here and no contributor is blocked by it.
SEC:core:
  stage: security
  image: ${JDK_IMAGE}
  before_script:
    - chmod +x gradlew
  script:
    #### Redacted because GitLab cannot mask a connection string (slashes) and
    #### job logs of a public project are readable by anyone.
    - set -o pipefail
    - ./gradlew :core:dependencyCheckAnalyze 2>&1
      | sed -e "s|${VC_DEPCHECK_URL}|[redacted]|g"
            -e "s|${VC_DEPCHECK_USERNAME}|[redacted]|g"
            -e "s|${VC_DEPCHECK_PASSWORD}|[redacted]|g"
  cache:
    <<: *gradle-cache
    policy: pull
  artifacts:
    name: "vc-core-security-${CI_COMMIT_REF_NAME}-${CI_PIPELINE_ID}"
    paths: [ "core/build/reports" ]
    when: always
    expire_in: 1 week
  needs: [ "BLD:core" ]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $VC_DEPCHECK_URL && $VC_DEPCHECK_USERNAME && $VC_DEPCHECK_PASSWORD'
  tags: [ "$VC_DEPCHECK_RUNNER_TAG" ]
  allow_failure: true

###############################################################################
#### dashboard (frontend)
###############################################################################
#### Without the VC_NPM_* variables npm uses the public registry.
#### Shared by all dashboard jobs, so the registry setup cannot drift apart
#### between them.
.npm-setup: &npm-setup
  - |
    #### Credential keys are derived from the registry URL itself, so the two
    #### cannot disagree — npm then finds no credentials and gets a 401.
    #### Nothing here may print a value: job logs are public.
    if [ -n "$VC_NPM_REGISTRY" ]; then
      base="${VC_NPM_REGISTRY%/}/"
      key="${base#http*:}"
      {
        echo "registry=$base"
        echo "${key}:username=$VC_NPM_USERNAME"
        echo "${key}:_password=$(printf '%s' "$VC_NPM_PASSWORD" | base64 | tr -d '\n')"
      } > "$HOME/.npmrc"
      unset NPM_CONFIG_REGISTRY
      echo "npm: mirror configured"
    else
      echo "npm: public registry"
    fi
  - cd dashboard

BLD:dashboard:
  stage: build
  image: ${NODE_IMAGE}
  before_script: *npm-setup
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run i18n:verify
    - npm run build
  cache: *node-cache
  artifacts:
    name: "vc-dashboard-${CI_COMMIT_REF_NAME}-${CI_PIPELINE_ID}"
    paths: [ "dashboard/dist" ]
    expire_in: 1h
  retry: 1

#### Runs in jsdom, so no browser and no display are needed in the job.
TST:dashboard:
  stage: test
  image: ${NODE_IMAGE}
  before_script: *npm-setup
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx ng test
  cache:
    <<: *node-cache
    policy: pull
  needs: [ "BLD:dashboard" ]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  retry: 1

#### Like DEP:core: npm-check-updates fails on available updates, allow_failure makes that a warning.
DEP:dashboard:
  stage: dependency
  image: ${NODE_IMAGE}
  before_script: *npm-setup
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run dep:update
  cache:
    <<: *node-cache
    policy: pull
  needs: [ "BLD:dashboard" ]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true

#### Against the public registry: a mirror configured through VC_NPM_* need not answer npm audit.
#### Reads the lockfile alone, so it needs no install and no build.
SEC:dashboard:
  stage: security
  image: ${NODE_IMAGE}
  before_script: *npm-setup
  script:
    - npm audit --omit=dev --registry=https://registry.npmjs.org
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true

###############################################################################
#### Images — a branch build goes to the GitLab registry only. A release tag
#### goes there and, with DOCKER_HUB_USER and DOCKER_HUB_TOKEN, to Docker Hub,
#### each time as <version>, <major>.<minor>, <major> and latest.
###############################################################################
.image: &image
  stage: artifact
  image: docker:dind
  services:
    - docker:dind
  before_script:
    - echo "${CI_JOB_TOKEN}" | docker login -u gitlab-ci-token --password-stdin "${CI_REGISTRY}"
    - |
      #### Job logs are public: nothing here may print a value.
      publish() {
        docker push "${CI_REGISTRY_IMAGE}:${MODULE}-${VERSION}"
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          targets="${CI_REGISTRY_IMAGE}"
          if [ -n "${DOCKER_HUB_USER:-}" ] && [ -n "${DOCKER_HUB_TOKEN:-}" ]; then
            echo "${DOCKER_HUB_TOKEN}" | docker login -u "${DOCKER_HUB_USER}" --password-stdin > /dev/null
            targets="${targets} ${VC_DOCKER_HUB_REPOSITORY}"
          fi
          for target in ${targets}; do
            for tag in "${VERSION}" "$(echo "${VERSION}" | cut -d. -f1,2)" "${VERSION%%.*}" latest; do
              docker tag "${CI_REGISTRY_IMAGE}:${MODULE}-${VERSION}" "${target}:${MODULE}-${tag}"
              docker push "${target}:${MODULE}-${tag}"
            done
          done
        fi
      }
  after_script:
    - docker logout ${CI_REGISTRY}
    - docker logout
    - rm -f /root/.docker/config.json
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_REF_NAME == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:\.\d+)?$/'
  tags: [ "image" ]
  retry: 1

IMG:core:
  <<: *image
  variables:
    MODULE: vc-core
  script:
    #### Excludes the plain jar — it would start and die with "no main manifest".
    - JAR_FILE=$(ls core/build/libs/vc-core-*.jar | grep -v -- '-plain' | head -1)
    - echo "Building ${MODULE}-${VERSION} from ${JAR_FILE}"
    - docker build --pull -t ${CI_REGISTRY_IMAGE}:${MODULE}-${VERSION} core
      --build-arg IMAGE_VERSION=${JRE_IMAGE_VERSION}
      --build-arg APP_VERSION=${VERSION}
      --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
      --build-arg JAR_FILE=$(basename ${JAR_FILE} | sed 's|^|build/libs/|')
    - publish
  needs: [ "BLD:core" ]

IMG:dashboard:
  <<: *image
  variables:
    MODULE: vc-dashboard
  script:
    - docker build --pull -t ${CI_REGISTRY_IMAGE}:${MODULE}-${VERSION} dashboard
      --build-arg APP_VERSION=${VERSION}
      --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - publish
  needs: [ "BLD:dashboard" ]

###############################################################################
#### Release — on a version tag, each job only where its credentials exist
###############################################################################
#### The Docker Hub page shows README.md, so it describes the release it came with.
RLS:readme:
  stage: release
  image: docker:dind
  services:
    - docker:dind
  script:
    #### Docker Hub takes at most 25,000 characters - counted here in bytes, which is stricter.
    - |
      size=$(wc -c < README.md)
      if [ "$size" -gt 25000 ]; then
        echo "README.md has $size bytes, Docker Hub takes 25000"
        exit 1
      fi
    #### '-e NAME' without a value takes it from the environment; with a value the token would be in the process list.
    - DOCKERHUB_PASSWORD="${DOCKER_HUB_TOKEN}" docker run --rm -v "$PWD:/workspace"
      -e DOCKERHUB_USERNAME="${DOCKER_HUB_USER}"
      -e DOCKERHUB_PASSWORD
      -e DOCKERHUB_REPOSITORY="${VC_DOCKER_HUB_REPOSITORY}"
      -e SHORT_DESCRIPTION="Inventory of the versions your infrastructure runs, with update and end-of-life checks"
      -e README_FILEPATH=/workspace/README.md
      peterevans/dockerhub-description:4
  needs: [ "IMG:core", "IMG:dashboard" ]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:\.\d+)?$/ && $DOCKER_HUB_USER && $DOCKER_HUB_TOKEN'
  tags: [ "image" ]
  retry: 1

#### The code reaches GitHub through the GitLab push mirror, so the job waits for the tag there.
#### GITHUB_TOKEN: fine-grained, Contents read and write. Protected, so the tag has to be protected too.
RLS:github:
  stage: release
  image: ${ALPINE_IMAGE}
  script:
    - apk add --no-cache curl jq > /dev/null
    - |
      api="https://api.github.com/repos/${VC_GITHUB_REPOSITORY}"
      #### curl reads the header from a file, so the token stays out of the process list.
      auth_file=$(mktemp)
      printf 'Authorization: Bearer %s\n' "${GITHUB_TOKEN}" > "$auth_file"
      auth="@$auth_file"
      #### Ends at the next heading of any kind: entries from before a tag sit under a plain date.
      notes=$(awk -v head="## [${CI_COMMIT_TAG}]" 'index($0, head) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md)
      if [ -z "$notes" ]; then
        echo "CHANGELOG.md has no entry for ${CI_COMMIT_TAG}"
        exit 1
      fi
      images="- \`${CI_REGISTRY_IMAGE}:vc-core-${CI_COMMIT_TAG}\`, \`:vc-dashboard-${CI_COMMIT_TAG}\` (GitLab)"
      if [ -n "${DOCKER_HUB_USER:-}" ] && [ -n "${DOCKER_HUB_TOKEN:-}" ]; then
        images="- \`${VC_DOCKER_HUB_REPOSITORY}:vc-core-${CI_COMMIT_TAG}\`, \`:vc-dashboard-${CI_COMMIT_TAG}\` (Docker Hub)
      ${images}"
      fi
      body=$(printf '%s\n\n### Images\n\n%s\n' "$notes" "$images")
      if curl -sf -H "$auth" "$api/releases/tags/${CI_COMMIT_TAG}" > /dev/null; then
        echo "Release ${CI_COMMIT_TAG} already exists on GitHub"
        exit 0
      fi
      tries=0
      until curl -sf -H "$auth" "$api/git/ref/tags/${CI_COMMIT_TAG}" > /dev/null; do
        tries=$((tries + 1))
        if [ "$tries" -ge 60 ]; then
          echo "Tag ${CI_COMMIT_TAG} did not reach GitHub within 10 minutes - check the push mirror"
          exit 1
        fi
        sleep 10
      done
      jq -n --arg tag "${CI_COMMIT_TAG}" --arg body "$body" '{tag_name: $tag, name: $tag, body: $body}' \
        | curl -sS --fail-with-body -X POST -H "$auth" -H "Accept: application/vnd.github+json" "$api/releases" -d @- > /dev/null
      echo "Release ${CI_COMMIT_TAG} created on GitHub"
  needs: [ "IMG:core", "IMG:dashboard" ]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:\.\d+)?$/ && $GITHUB_TOKEN'
